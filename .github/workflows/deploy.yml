name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Format generated interface code in the ephemeral CI checkout before verification.
      - run: npx prettier --write src/App.tsx src/App.css tests/App.test.tsx tests/e2e/app.spec.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/configure-pages@v5
      - name: Build site
        run: npm run build
        env:
          BASE_PATH: /ddr-timeline/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4      - name: Verify public Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          URL="https://munomono.github.io/ddr-timeline/"
          echo "Checking ${URL}"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --location --silent --show-error "${URL}" -o /tmp/ddr-index.html &&
               grep -q 'id="root"' /tmp/ddr-index.html &&
               grep -q '/ddr-timeline/assets/' /tmp/ddr-index.html; then
              echo "GitHub Pages shell and bundled asset references are online."
              break
            fi
            if [ "${attempt}" -eq 6 ]; then echo "GitHub Pages smoke test failed"; exit 1; fi
            sleep 10
          done
          ASSET=$(grep -oE '/ddr-timeline/assets/index-[^"]+\.js' /tmp/ddr-index.html | head -n 1)
          test -n "${ASSET}"
          curl --fail --location --silent --show-error "https://munomono.github.io${ASSET}" -o /tmp/ddr-app.js
          test -s /tmp/ddr-app.js
          curl --fail --location --silent --show-error "${URL}data/agent_employment.json" -o /tmp/ddr-staff.json
          node -e "const f=require('/tmp/ddr-staff.json'); if(!Array.isArray(f.agent_employment)||f.agent_employment.length<80)process.exit(1); console.log('Published employment records:',f.agent_employment.length)"
          echo "PASS: public HTML, JS asset and archival data available."
